name: Build

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v2

    - name: Configurar JDK 21
      uses: actions/setup-java@v1
      with:
        java-version: '21'

    - name: Cache Gradle User Files
      uses: actions/cache@v4
      with:
        path: ~/.gradle
        key: ${{ runner.os }}-gradle-user-home

    - name: Cache Gradle Files
      uses: actions/cache@v4
      with:
        path: ./.gradle
        key: ${{ runner.os }}-gradle-file

    - name: Conceder permissão de execução ao Gradle Wrapper
      run: chmod +x gradlew

    - name: Construir o projeto
      run: ./gradlew clean build collect --no-daemon --stacktrace

    - name: Upload do artefato
      uses: actions/upload-artifact@v4
      with:
        name: Arclight
        path: build/libs/*.jar
